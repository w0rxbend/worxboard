name: firmware

# Mirrors zmkfirmware/zmk .github/workflows/build-user-config.yml @ the west.yml SHA. The reusable
# workflow cannot be called directly: its copy step runs `mkdir <tmp>/<config_path>` without -p, so
# the nested config_path firmware/zmk/config fails (docs/deviations.md WS1-1). Same image, same
# matrix file, same west/cmake arguments, same per-row artifacts merged into one archive.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ZMK_SHA: 4dd95d7840eb3d5a3f59bb29fbf1ab054715ef85   # keep equal to firmware/zmk/config/west.yml

jobs:
  checks:
    name: Layout dtsi and keymap
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: west.yml pins the same ZMK SHA
        run: |
          grep -qx "      revision: ${ZMK_SHA}" firmware/zmk/config/west.yml
      - name: worxboard-layouts.dtsi regenerates with no diff
        run: |
          python3 firmware/zmk/scripts/gen_layouts.py
          git diff --exit-code -- firmware/zmk/boards
      - name: keymap has 3 layers x 74 bindings and base = layout.json legends
        run: python3 firmware/zmk/scripts/check_keymap.py

  matrix:
    name: Fetch build matrix
    runs-on: ubuntu-24.04
    outputs:
      build_matrix: ${{ steps.fetch.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: fetch
        run: echo "build_matrix=$(yq -oj -I0 build.yaml)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.artifact-name }}
    needs: [checks, matrix]
    runs-on: ubuntu-24.04
    container:
      image: zmkfirmware/zmk-build-arm:stable
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.build_matrix) }}
    env:
      WS: /tmp/zmk-ws
    steps:
      - uses: actions/checkout@v4

      - name: Isolated west workspace
        run: |
          mkdir -p "$WS/config"
          cp firmware/zmk/config/west.yml "$WS/config/west.yml"

      - name: Cache west modules
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            /tmp/zmk-ws/modules/
            /tmp/zmk-ws/tools/
            /tmp/zmk-ws/zephyr/
            /tmp/zmk-ws/bootloader/
            /tmp/zmk-ws/zmk/
          key: ${{ runner.os }}-zmk-ws-${{ hashFiles('firmware/zmk/config/west.yml') }}
          restore-keys: ${{ runner.os }}-zmk-ws-

      - name: West init / update / zephyr-export
        working-directory: /tmp/zmk-ws
        run: |
          west init -l config
          west update --fetch-opt=--filter=tree:0
          test "$(west list -f '{revision}' zmk)" = "$ZMK_SHA"
          west zephyr-export

      - name: West build (${{ matrix.board }})
        working-directory: /tmp/zmk-ws
        run: FW_REPO="$GITHUB_WORKSPACE" python3 "$GITHUB_WORKSPACE/firmware/zmk/scripts/fw_build.py" "${{ matrix.artifact-name }}"

      - name: Right peripheral checks (no BLE symbols, flash budget)
        if: matrix.artifact-name == 'worxboard_right_peripheral'
        run: python3 firmware/zmk/scripts/fw_check.py build/fw

      - name: Kconfig
        if: ${{ !cancelled() }}
        run: grep -v -e "^#" -e "^$" "build/fw/${{ matrix.artifact-name }}/zephyr/.config" | sort || true

      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.artifact-name }}
          path: build/fw/artifacts/${{ matrix.artifact-name }}.uf2
          if-no-files-found: error

  merge:
    name: Merge output artifacts
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: worxboard-firmware
          pattern: artifact-*
          delete-merged: true
