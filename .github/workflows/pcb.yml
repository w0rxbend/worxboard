name: pcb

# Spec §9: the headless KiCad pipeline. `schematic` regenerates stages 1-6 and requires the committed
# schematics to be current; `board` gates the committed boards (DRC + checks) and builds the fab
# outputs (jlc/, STEP, Edge DXF, renders); `fit` runs the case fit check (WS3) against those STEPs;
# `rebuild` runs place -> Freerouting -> finish from scratch and requires the result to equal the
# committed board (the pipeline is seeded, docs/deviations.md WS2c-4).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schematic:
    name: Schematics, ERC, netcmp (stages 1-6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v2
      - name: just pcb-sch-all (fails if pcb/lib or the schematics change)
        run: just pcb-sch-all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worxboard-pcb-erc
          path: |
            build/*/erc.json
            build/*/*.net

  board:
    name: Board ${{ matrix.side }}, DRC gate and fab outputs (stages 11-14)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        side: [left, right]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v2
      - name: Free disk for the KiCad images (base + -full, about 11 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: just pcb-drc (schematic parity, 0 violations, 0 unconnected, checks.py)
        run: just pcb-drc ${{ matrix.side }}
      - name: just pcb-fab (kikit --missingError, renders, Edge DXF, STEP)
        run: just pcb-fab ${{ matrix.side }}
      - name: Committed renders are current (pixel compare, deviations BOARD-12)
        run: just pcb-render-check ${{ matrix.side }}
      - uses: actions/upload-artifact@v4
        with:
          name: worxboard-pcb-${{ matrix.side }}
          path: |
            build/${{ matrix.side }}/jlc/gerbers.zip
            build/${{ matrix.side }}/jlc/bom.csv
            build/${{ matrix.side }}/jlc/pos.csv
            build/${{ matrix.side }}/worxboard-${{ matrix.side }}.step
            build/${{ matrix.side }}/edge.dxf
            build/${{ matrix.side }}/drc.json
            docs/images/pcb-${{ matrix.side }}-*.png
          if-no-files-found: error

  fit:
    name: Case fit check against the PCB STEPs (stage 14 -> WS3)
    needs: board
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: extractions/setup-just@v2
      - name: Fonts for the side mark
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - name: Install the case group
        run: uv sync --locked --group case
      - uses: actions/download-artifact@v4
        with:
          name: worxboard-pcb-left
      - uses: actions/download-artifact@v4
        with:
          name: worxboard-pcb-right
      - name: Both STEPs are in place (fitcheck would otherwise fall back to the layout envelopes)
        run: test -s build/left/worxboard-left.step && test -s build/right/worxboard-right.step
      - name: just model && just fitcheck (0 mm3 against the PCB STEPs)
        run: just model && just fitcheck

  rebuild:
    name: Rebuild ${{ matrix.side }} from scratch (stages 7-12)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        side: [left, right]
    env:
      GH_TOKEN: ${{ github.token }}   # tools/fetch_freerouting.sh (gh release download)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v2
      - name: just pcb-sch (stages 1-6, the netlist placement reads)
        run: just pcb-sch ${{ matrix.side }}
      - name: just pcb-place (placement, locked critical routes, DSN)
        run: just pcb-place ${{ matrix.side }}
      - name: just pcb-route (Freerouting 2.5.0)
        run: just pcb-route ${{ matrix.side }}
      - name: just pcb-finish (SES import, completion, pours, DRC gate, checks)
        run: just pcb-finish ${{ matrix.side }}
      - name: The rebuilt board equals the committed one
        run: git diff --exit-code --stat -- pcb/${{ matrix.side }}/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worxboard-pcb-rebuild-${{ matrix.side }}
          path: |
            pcb/${{ matrix.side }}/worxboard-${{ matrix.side }}.kicad_pcb
            build/${{ matrix.side }}/drc.json
            build/${{ matrix.side }}/freerouting.log
          if-no-files-found: warn
