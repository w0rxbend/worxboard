name: release

# Spec §14 WS5: on a v* tag, build the firmware, PCB fab outputs and case from the tagged commit,
# run the integration tests on those outputs, and publish them as a GitHub pre-release:
# worxboard-<tag>-pcb-{left,right}.zip (JLCPCB gerbers.zip, bom.csv, pos.csv, board STEP, Edge DXF),
# one .uf2 per build.yaml row, worxboard-<tag>-case-{step,stl}.zip and SHA256SUMS.txt.
# tests/integration/release.py assembles the assets; `just all` + that script do the same locally.
# Tag push only: nothing here runs on branches, pull requests or by hand.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firmware:
    name: Firmware (just fw, every build.yaml row)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: just fw (zmk-build-arm in Docker; layouts, keymap and right-half checks included)
        run: just fw
      - uses: actions/upload-artifact@v4
        with:
          name: release-firmware
          path: |
            build/fw/artifacts/*.uf2
            build/fw/*/zephyr/zephyr.dts
          if-no-files-found: error

  pcb:
    name: PCB ${{ matrix.side }} (netlist, DRC gate, fab outputs)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        side: [left, right]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v2
      - name: Free disk for the KiCad images (base + -full, about 11 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: just pcb-sch (ERC, netlist, netcmp; the integration tests read the netlist)
        run: just pcb-sch ${{ matrix.side }}
      - name: just pcb-drc (schematic parity, 0 violations, 0 unconnected, checks.py)
        run: just pcb-drc ${{ matrix.side }}
      - name: just pcb-fab (kikit --missingError, renders, Edge DXF, STEP)
        run: just pcb-fab ${{ matrix.side }}
      - name: The tagged schematics and renders are current
        run: git diff --exit-code --stat -- pcb/lib pcb/${{ matrix.side }}/*.kicad_sch docs/images/pcb-${{ matrix.side }}-*.png
      - uses: actions/upload-artifact@v4
        with:
          name: release-pcb-${{ matrix.side }}
          path: |
            build/${{ matrix.side }}/jlc/gerbers.zip
            build/${{ matrix.side }}/jlc/bom.csv
            build/${{ matrix.side }}/jlc/pos.csv
            build/${{ matrix.side }}/worxboard-${{ matrix.side }}.step
            build/${{ matrix.side }}/edge.dxf
            build/${{ matrix.side }}/${{ matrix.side }}.net
          if-no-files-found: error

  case:
    name: Case (just model)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: extractions/setup-just@v2
      - name: Fonts for the side mark
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - name: Install the case group
        run: uv sync --locked --group case
      - name: just model (fails on any case check)
        run: just model
      - name: Plates are up to date
        run: git diff --exit-code -- plates/
      - uses: actions/upload-artifact@v4
        with:
          name: release-case
          path: |
            case/exports/*.step
            case/exports/*.stl
            case/exports/*_fitcheck.dxf
          if-no-files-found: error

  release:
    name: Integration tests and GitHub pre-release
    needs: [firmware, pcb, case]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: release-firmware
          path: build/fw
      - uses: actions/download-artifact@v4
        with:
          name: release-pcb-left
          path: build/left
      - uses: actions/download-artifact@v4
        with:
          name: release-pcb-right
          path: build/right
      - uses: actions/download-artifact@v4
        with:
          name: release-case
          path: case/exports
      - name: Install the layout and dev groups
        run: uv sync --locked
      - name: pytest tests/integration (firmware DT vs netlist vs pins.py, release assembly; no skips)
        run: |
          set -o pipefail
          uv run pytest tests/integration -rs | tee pytest.log
          ! grep -q SKIPPED pytest.log
      - name: Assemble the assets (tests/integration/release.py -> dist/)
        run: uv run python tests/integration/release.py --version "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: worxboard-release
          path: dist/
          if-no-files-found: error
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.uf2 dist/SHA256SUMS.txt \
            --title "worxboard $GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md \
            --prerelease \
            --verify-tag
