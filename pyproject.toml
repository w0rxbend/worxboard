[project]
name = "worxboard"
version = "0.1.0"
description = "ErgoDox EZ-style split keyboard: RP2040, ZMK wired split, nice!view LCD, KiCad PCB, build123d case"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = "==3.12.*"
dependencies = []

[dependency-groups]
layout = ["shapely==2.2.0"]
case = ["build123d==0.13.0", "shapely==2.2.0", "ezdxf==1.4.5"]
dev = ["pytest>=8"]

[tool.uv]
package = false
default-groups = ["layout", "dev"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["layout/tests"]
addopts = "-q"
